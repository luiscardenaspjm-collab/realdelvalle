<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real del Valle · Inventario</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2EEE6;color:#1A1A18;font-size:13px;min-height:100vh}
.hdr{background:#1A1A18}
.hdr-top{display:flex;align-items:center;gap:12px;padding:13px 22px 9px}
.logo{width:36px;height:36px;border-radius:50%;background:#BA7517;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
.brand{font-size:14px;font-weight:500;color:#fff}
.brand-sub{font-size:11px;color:#555;margin-top:2px}
.main-nav{display:flex;border-top:1px solid #2A2A24;overflow-x:auto}
.mnb{padding:10px 15px;background:none;border:none;border-bottom:2px solid transparent;color:#666;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.mnb.act{color:#EF9F27;border-bottom-color:#EF9F27;font-weight:500}
.mnb:hover:not(.act){color:#bbb}
.ptabs{display:flex;background:#fff;border-bottom:1px solid #E5DFD3;padding:0 22px;overflow-x:auto}
.ptab{padding:9px 15px;background:none;border:none;border-bottom:2px solid transparent;font-size:12px;cursor:pointer;color:#999;display:flex;align-items:center;gap:7px;font-family:inherit;white-space:nowrap}
.ptab.act{color:#1A1A18;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.page{padding:16px 22px;max-width:1100px}
.card{background:#fff;border-radius:10px;border:0.5px solid #DDD7CC;overflow:hidden;margin-bottom:14px}
.card-h{padding:11px 16px;border-bottom:0.5px solid #EEE8DF;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#999}
.card-body{padding:14px 16px}
.ox{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th{padding:8px 12px;font-size:11px;font-weight:400;color:#aaa;text-align:right;background:#F6F2EA;border-bottom:0.5px solid #EEE8DF;white-space:nowrap}
th.tl,th:first-child{text-align:left}
th.hl{color:#BA7517;font-weight:500}
th.hteal{color:#0F6E56;font-weight:500}
td{padding:6px 12px;border-bottom:0.5px solid #F0EAE0;text-align:right;font-size:12px;vertical-align:middle}
td:first-child{text-align:left;color:#444}
tr.cat-row td{background:#F6F2EA;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#bbb;padding:5px 12px;pointer-events:none}
tr:last-child td{border-bottom:none}
tr:not(.cat-row):hover td{background:#FDFCF8}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:12px}
.rdv-code{font-family:'SF Mono',Consolas,monospace;font-size:10px;color:#BA7517;background:#FEF3E2;border:0.5px solid #F0D090;border-radius:4px;padding:1px 5px;margin-right:6px;flex-shrink:0}
.mat-name{display:flex;align-items:center}
.pos{color:#27783A}.neg{color:#B02E1E}.zer{color:#ccc}
input,select,textarea{padding:8px 10px;border:0.5px solid #C8C0B0;border-radius:6px;font-size:12px;color:#1A1A18;background:#fff;width:100%;font-family:inherit}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#BA7517;box-shadow:0 0 0 3px rgba(186,117,23,.1)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:#888}
.btn{padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:none;font-weight:500;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-pr{background:#BA7517;color:#fff}.btn-pr:hover{background:#9E6413}
.btn-ok{background:#27783A;color:#fff}.btn-ok:hover{background:#1D5E2C}
.btn-gh{background:#fff;border:0.5px solid #C8C0B0;color:#555}.btn-gh:hover{background:#F2EEE6}
.btn-dn{background:#fff;border:0.5px solid #F09595;color:#A32D2D}.btn-dn:hover{background:#FAECE7}
.btn-teal{background:#0F6E56;color:#fff}.btn-teal:hover{background:#085041}
.btn-sm{padding:5px 10px;font-size:11px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap}
.b-out{background:#FAECE7;color:#993C1D}
.b-warn{background:#FAEEDA;color:#633806}
.b-teal{background:#E1F5EE;color:#0F6E56}
.b-blue{background:#E6F1FB;color:#185FA5}
.wiz-bar{display:flex;margin-bottom:16px;border-radius:8px;overflow:hidden;border:0.5px solid #DDD7CC}
.wiz-s{flex:1;padding:10px 12px;font-size:11px;background:#F6F2EA;color:#bbb;border-right:0.5px solid #DDD7CC;text-align:center}
.wiz-s:last-child{border-right:none}
.wiz-s.act{background:#fff;color:#BA7517;font-weight:500}
.wiz-s.done{background:#EAF3DE;color:#27783A}
.alloc-block{border:0.5px solid #DDD7CC;border-radius:8px;overflow:hidden;margin-bottom:10px}
.alloc-hdr{padding:9px 14px;border-bottom:0.5px solid #DDD7CC;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.alloc-hdr.mat{background:#F6F2EA}
.alloc-hdr.gra{background:#E1F5EE}
.alloc-name{font-size:12px;font-weight:500;display:flex;align-items:center}
.alloc-need{font-size:11px;font-family:'SF Mono',Consolas,monospace}
.alloc-row{display:grid;grid-template-columns:1.8fr 1fr;gap:10px;padding:9px 14px;border-bottom:0.5px solid #F0EAE0;align-items:center}
.alloc-row:last-child{border-bottom:none}
.alloc-fnum{font-size:11px;font-weight:500}
.alloc-fdisp{font-size:10px;color:#bbb;margin-top:1px}
.alloc-st{font-size:11px;font-weight:500}
.st-ok{color:#27783A}.st-err{color:#B02E1E}.st-warn{color:#BA7517}
.insight{background:#FAEEDA;border-left:3px solid #EF9F27;border-radius:0 8px 8px 0;padding:10px 14px;font-size:11px;color:#412402;margin-bottom:14px;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{background:#F2EEE6;border:0.5px solid #DDD7CC;border-radius:6px;padding:4px 10px;font-size:11px;color:#555}
.chip strong{color:#1A1A18}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.dash-card{background:#fff;border-radius:10px;border:0.5px solid #DDD7CC;padding:14px 16px}
.dash-plant-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:0.5px solid #EEE8DF}
.dash-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #F5F1EA}
.dash-row:last-child{border-bottom:none}
.dash-lbl{font-size:11px;color:#777;display:flex;align-items:center;gap:4px}
.dash-val{font-size:12px;font-family:'SF Mono',Consolas,monospace;font-weight:500}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.metric-card{background:#fff;border-radius:10px;border:0.5px solid #DDD7CC;padding:14px 16px;text-align:center}
.metric-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#aaa;margin-bottom:6px}
.metric-val{font-size:22px;font-weight:600;font-family:'SF Mono',Consolas,monospace}
.metric-sub{font-size:10px;color:#bbb;margin-top:3px}
.prod-add-row{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end;margin-bottom:12px}
.prod-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:0.5px solid #E5DFD3;border-radius:7px;margin-bottom:6px;background:#FDFCF8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.dash-grid,.metric-grid,.row3,.row4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.dash-grid,.metric-grid,.row2,.row3,.row4{grid-template-columns:1fr}}
.pb{width:72px;height:5px;background:#EEE;border-radius:3px;display:inline-block;vertical-align:middle;overflow:hidden}
.pb-fill{height:100%;border-radius:3px}
.sep{border:none;border-top:0.5px solid #EEE8DF;margin:14px 0}
.srch-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.srch-bar input,.srch-bar select{flex:1;min-width:160px}
.traz-card{background:#fff;border:0.5px solid #DDD7CC;border-radius:10px;overflow:hidden;margin-bottom:10px}
.traz-h{padding:11px 16px;border-bottom:0.5px solid #EEE8DF;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.traz-body{padding:12px 16px}
.info-pill{display:inline-flex;align-items:center;gap:6px;background:#E1F5EE;border:0.5px solid #9FE1CB;border-radius:6px;padding:4px 10px;font-size:11px;color:#0F6E56;margin-bottom:12px}
#toast{position:fixed;bottom:22px;right:22px;background:#1A1A18;color:#fff;border-radius:8px;padding:11px 20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
.empty{text-align:center;padding:2.5rem;color:#ccc;font-size:12px}
.sec-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:10px}
.cat-sub{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#bbb;margin-bottom:4px;margin-top:8px}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:#1A1A18;display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px}
.login-box{background:#fff;border-radius:14px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{width:48px;height:48px;border-radius:50%;background:#BA7517;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;margin:0 auto 14px}
.login-title{text-align:center;font-size:18px;font-weight:600;margin-bottom:2px}
.login-sub{text-align:center;font-size:12px;color:#999;margin-bottom:24px}
.login-box .fg{margin-bottom:12px}
.login-err{background:#FAECE7;color:#A32D2D;border:0.5px solid #F09595;border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:12px;display:none}
.logout-btn{background:none;border:0.5px solid #444;color:#999;border-radius:5px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit}
.logout-btn:hover{border-color:#777;color:#ccc}
.nom-deg{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600;font-family:'SF Mono',Consolas,monospace;background:#E8F0FF;color:#1A3F8A;border:0.5px solid #9BB5F0;white-space:nowrap}
.nom-pb{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600;font-family:'SF Mono',Consolas,monospace;background:#FEF3E2;color:#7A3D00;border:0.5px solid #F0C070;white-space:nowrap}
.nom-emb{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600;font-family:'SF Mono',Consolas,monospace;background:#EDE7FB;color:#5B3B9E;border:0.5px solid #C3ADEE;white-space:nowrap}
.transito-badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;font-family:'SF Mono',Consolas,monospace;background:#E1F5EE;color:#0F6E56;border:0.5px solid #9FE1CB;white-space:nowrap}
.sim-chip{background:#FFF8F0;border:0.5px solid #F0D090;border-radius:6px;padding:4px 10px;font-size:11px;color:#555;display:inline-flex;align-items:center}
.sim-chip strong{color:#1A1A18}
.nom-btn{padding:6px 14px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid #C8C0B0;background:none;color:#888;font-family:inherit}
.nom-btn.sel-deg{background:#1A3F8A;color:#fff;border-color:#1A3F8A}
.nom-btn.sel-pb{background:#7A3D00;color:#fff;border-color:#7A3D00}
.nom-btn.sel-emb{background:#5B3B9E;color:#fff;border-color:#5B3B9E}
.view-toggle{display:flex;gap:0;border:0.5px solid #C8C0B0;border-radius:6px;overflow:hidden}
.view-btn{padding:5px 12px;font-size:11px;background:#fff;border:none;cursor:pointer;color:#888;font-family:inherit;white-space:nowrap}
.view-btn.act{background:#BA7517;color:#fff;font-weight:500}
.prod-group{border:0.5px solid #DDD7CC;border-radius:8px;overflow:hidden;margin-bottom:10px}
.prod-group-h{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:0.5px solid #EEE8DF}
.prod-group-name{font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.tarimas-badge{font-size:11px;font-family:'SF Mono',Consolas,monospace;font-weight:500}
.limitante{background:#FAECE7;color:#993C1D;border:0.5px solid #F09595;border-radius:4px;padding:2px 8px;font-size:10px}
.prod-mat-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 12px;padding:7px 14px;border-bottom:0.5px solid #F5F1EA;align-items:center;font-size:12px}
.prod-mat-row:last-child{border-bottom:none}
.prod-mat-row.is-limit{background:#FFF8F5}
.tar-cell{font-family:'SF Mono',Consolas,monospace;font-size:11px;text-align:right;min-width:70px}
.otros-group{border:0.5px solid #EEE8DF;border-radius:8px;overflow:hidden;margin-bottom:10px}
.otros-h{padding:9px 14px;background:#F8F6F1;border-bottom:0.5px solid #EEE8DF;font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">R</div>
    <div class="login-title">Real del Valle</div>
    <div class="login-sub">Sistema de Inventario</div>
    <div class="login-err" id="login-err"></div>
    <div class="fg"><label>Usuario</label><input type="text" id="login-user" autocomplete="username" placeholder="usuario"></div>
    <div class="fg"><label>Contraseña</label><input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-pr" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()">Entrar</button>
  </div>
</div>
<header class="hdr">
  <div class="hdr-top">
    <div class="logo">R</div>
    <div><div class="brand">Real del Valle</div><div class="brand-sub">Sistema de Inventario · 3 Plantas</div></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <span style="font-size:11px;color:#888" id="role-badge"></span>
      <span style="font-size:11px;color:#444" id="hdr-date"></span>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <nav class="main-nav">
    <button class="mnb" data-tab="dashboard" onclick="goTab('dashboard')">Dashboard</button>
    <button class="mnb" data-tab="inventario" onclick="goTab('inventario')">Inventario</button>
    <button class="mnb" data-tab="ingresos" onclick="goTab('ingresos')">Ingresos</button>
    <button class="mnb" data-tab="granel" onclick="goTab('granel')">Tequila Granel</button>

  </nav>
</header>
<div id="ptabs" class="ptabs" style="display:none"></div>
<div id="app" class="page"></div>
<div id="toast"></div>

<script>

//  CONFIG
// ═══════════════════════════════════════
const PLANTAS=[
  {id:'degollado',nom:'Degollado',   color:'#639922'},
  {id:'cuermaro', nom:'Cuermaro',    color:'#BA7517'},
  {id:'embajador',nom:'Embajador',   color:'#5B3B9E'},
  {id:'arandas',  nom:'Peña Blanca', color:'#D85A30'}
];

const LITROS_TARIMA={
  blanco_750:396, blanco_1000:529, blanco_1750:546,
  blanco_fuerte_1000:529,

PLANTAS.forEach(p=>PLANT_IDX[p.id]=p);

function hoy(){return new Date().toISOString().split('T')[0];}
const fmt=n=>Math.round(n||0).toLocaleString('es-MX');

// AUTENTICACIÓN + API (versión nube)
function getToken(){ return sessionStorage.getItem('rdv_token'); }
function setToken(t){ sessionStorage.setItem('rdv_token', t); }
function clearToken(){ sessionStorage.removeItem('rdv_token'); sessionStorage.removeItem('rdv_rol'); sessionStorage.removeItem('rdv_user'); }
function getRol(){ return sessionStorage.getItem('rdv_rol')||'viewer'; }
function isAdmin(){ return getRol()==='admin'; }

async function api(path, opts={}){
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(path, { ...opts, headers });
  if(res.status===401){ clearToken(); showLogin(); throw new Error('Sesión expirada'); }
  return res;
}

async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  const errEl=document.getElementById('login-err');
  errEl.style.display='none';
  if(!u||!p){ errEl.textContent='Ingresa usuario y contraseña'; errEl.style.display='block'; return; }
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await res.json();
    if(!res.ok){ errEl.textContent=data.error||'Error al entrar'; errEl.style.display='block'; return; }
    setToken(data.token);
    sessionStorage.setItem('rdv_rol', data.rol||'viewer');
    sessionStorage.setItem('rdv_user', data.username||'');
    document.getElementById('login-screen').style.display='none';
    await loadDB();
    render();
  }catch(e){ errEl.textContent='Error de conexión'; errEl.style.display='block'; }
}

function doLogout(){ clearToken(); location.reload(); }
function showLogin(){ document.getElementById('login-screen').style.display='flex'; }

async function loadDB(){
  try{
    const res=await api('/api/data');
    const d=await res.json();
    DB.facturas=d.facturas||[];
    DB.granel=d.granel||[];
    DB.salidas=d.salidas||[];
    DB.transito=d.transito||[];
    DB.traslados=d.traslados||[];
  }catch(e){ console.error(e); }
}
// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
function stockMat(plant,mat){return DB.facturas.filter(f=>f.plant===plant&&f.mat===mat&&f.cantRest>0).reduce((s,f)=>s+f.cantRest,0);}
function stockMatNom(plant,mat,nom){return DB.facturas.filter(f=>f.plant===plant&&f.mat===mat&&f.nom===nom&&f.cantRest>0).reduce((s,f)=>s+f.cantRest,0);}
function factsAvail(plant,mat){return DB.facturas.filter(f=>f.plant===plant&&f.mat===mat&&f.cantRest>0);}
function transitoMat(plant,mat){return (DB.transito||[]).filter(t=>t.plant===plant&&t.mat===mat).reduce((s,t)=>s+t.cant,0);}
async function marcarLlegada(plant,mat){
  if(!isAdmin()){toast('Solo lectura: no puedes marcar llegadas',true);render();return;}
  const ents=(DB.transito||[]).filter(t=>t.plant===plant&&t.mat===mat);
  if(!ents.length)return;
  const total=ents.reduce((s,t)=>s+t.cant,0);
  const m=MAT_IDX[mat];
  if(!confirm(`¿Marcar llegada de ${fmt(total)} ${m?.nom}?\nSe sumará a Disponible y saldrá de En tránsito.`)){render();return;}
  try{
    const res=await api('/api/llegada',{method:'POST',body:JSON.stringify({plant,mat})});
    if(!res.ok)throw new Error();
    const b=Date.now();
    ents.forEach((t,i)=>{
      const entry={id:b+i,num:'LLEGADA-TRANSITO',prov:'Entrega recibida',plant,mat,cantIni:t.cant,cantRest:t.cant,fecha:hoy()};
      if(t.nom)entry.nom=t.nom;
      DB.facturas.push(entry);
    });
    DB.transito=DB.transito.filter(t=>!(t.plant===plant&&t.mat===mat));
    toast(`✓ Llegada registrada: ${fmt(total)} ${m?.nom}`);
    render();
  }catch(e){toast('Error al registrar llegada',true);render();}
}
const isEtiq=id=>id.startsWith('etiq_');
const nomClass=nom=>nom==='DEG'?'nom-deg':nom==='EMB'?'nom-emb':'nom-pb';
const nomBadge=nom=>nom?`<span class="${nomClass(nom)}">NOM ${nom}</span>`:'';
const nomBadgeInline=nom=>nom?` <span class="${nomClass(nom)}" style="margin-left:4px">NOM ${nom}</span>`:'';
function litrosNecesarios(prods){const n={Blanco:0,Reposado:0};prods.forEach(p=>{const pr=PROD_IDX[p.prodId];if(!pr)return;n[pr.tipo]=(n[pr.tipo]||0)+(LITROS_TARIMA[p.prodId]||0)*p.tarimas;});return n;}
function granelAvail(planta,tipo){return DB.granel.filter(g=>g.planta===planta&&g.tipo===tipo&&g.litrosRest>0);}
function granelStats(planta){const l=DB.granel.filter(g=>g.planta===planta);return{entro:l.reduce((s,g)=>s+g.litros,0),usado:l.reduce((s,g)=>s+(g.litros-g.litrosRest),0),disp:l.reduce((s,g)=>s+g.litrosRest,0)};}
function calcNeeded(prods){const n={};prods.forEach(p=>{const pr=PROD_IDX[p.prodId];if(!pr)return;Object.entries(pr.mats).forEach(([mid,u])=>{n[mid]=(n[mid]||0)+u*p.tarimas;});});return n;}
let _tt;
function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#A32D2D':'#1A1A18';t.style.opacity=1;clearTimeout(_tt);_tt=setTimeout(()=>t.style.opacity=0,2700);}

function render(){
  document.getElementById('hdr-date').innerHTML=new Date().toLocaleDateString('es-MX',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
  const admin=isAdmin();
  // Para viewer: solo Dashboard, Inventario, Trazabilidad
  const editTabs=['ingresos','granel','salidas','traslados'];
  document.querySelectorAll('.mnb').forEach(b=>{
    const t=b.getAttribute('data-tab');
    if(!admin && editTabs.includes(t)) b.style.display='none';
    else b.style.display='';
  });
  // Si un viewer está en una pestaña restringida, lo mandamos a dashboard
  if(!admin && editTabs.includes(UI.tab)) UI.tab='dashboard';
  const tabs=['dashboard','inventario','ingresos','granel','salidas','trazabilidad','traslados'];
  document.querySelectorAll('.mnb').forEach((b,i)=>b.classList.toggle('act',tabs[i]===UI.tab));
  const ptEl=document.getElementById('ptabs');
  const showPt=['inventario','ingresos'].includes(UI.tab);
  if(showPt){ptEl.style.display='flex';ptEl.innerHTML=PLANTAS.map(p=>`<button class="ptab ${UI.plant===p.id?'act':''}" style="${UI.plant===p.id?`border-bottom-color:${p.color};color:#1A1A18`:''}" onclick="UI.plant='${p.id}';render()"><span class="dot" style="background:${p.color}"></span>${p.nom}</button>`).join('');}
  else ptEl.style.display='none';
  // Indicador de rol
  const roleEl=document.getElementById('role-badge');
  if(roleEl){const u=sessionStorage.getItem('rdv_user')||'';roleEl.innerHTML=admin?`${u} · <span style="color:#7FCF9F">Administrador</span>`:`${u} · <span style="color:#E0B968">Solo lectura</span>`;}
  const app=document.getElementById('app');
  if(UI.tab==='dashboard')       app.innerHTML=rDash();
  else if(UI.tab==='inventario') app.innerHTML=rInv();
  else if(UI.tab==='ingresos')   app.innerHTML=rIng();
  else if(UI.tab==='granel')     app.innerHTML=rGranel();
  else if(UI.tab==='salidas')    app.innerHTML=rSal();
  else if(UI.tab==='traslados')  app.innerHTML=rTraslados();
  else                           app.innerHTML=rTraz();
}

// ── DASHBOARD ──────────────────────────────────────────
function rDash(){
  let tE=0,tU=0,tD=0;
  PLANTAS.forEach(p=>{const s=granelStats(p.id);tE+=s.entro;tU+=s.usado;tD+=s.disp;});
  const metrics=tE>0?`<div class="metric-grid">
    <div class="metric-card"><div class="metric-label">Granel ingresado total</div><div class="metric-val" style="color:#0F6E56">${fmt(tE)}<span style="font-size:13px;font-weight:400"> L</span></div><div class="metric-sub">todas las plantas</div></div>
    <div class="metric-card"><div class="metric-label">Granel consumido</div><div class="metric-val" style="color:#BA7517">${fmt(tU)}<span style="font-size:13px;font-weight:400"> L</span></div><div class="metric-sub">en salidas de camión</div></div>
    <div class="metric-card"><div class="metric-label">Granel disponible</div><div class="metric-val" style="color:${tD<=0?'#B02E1E':'#1A1A18'}">${fmt(tD)}<span style="font-size:13px;font-weight:400"> L</span></div><div class="metric-sub">en bodega</div></div>
  </div>`:'';

  const pCards=PLANTAS.map(p=>{
    const gs=granelStats(p.id);
    const secRows=(cat,color)=>MATS.filter(m=>m.cat===cat).map(m=>{const s=stockMat(p.id,m.id);const hasRec=DB.facturas.some(f=>f.plant===p.id&&f.mat===m.id);const trans=transitoMat(p.id,m.id);if(!hasRec&&trans<=0)return '';const valColor=s<=0?'#B02E1E':color;return `<div class="dash-row"><span class="dash-lbl"><span style="font-family:'SF Mono',monospace;font-size:9px;color:#BA7517;background:#FEF3E2;border:0.5px solid #F0D090;border-radius:3px;padding:0 4px;margin-right:4px">${m.rdv}</span>${m.nom}</span><span class="dash-val" style="color:${valColor}">${fmt(s)}${trans>0?`<span style="color:#0F6E56;font-size:10px;font-weight:400"> · →${fmt(trans)}</span>`:''}</span></div>`;}).join('');
    const bots=secRows('Botellas','#27783A');
    const etiqs=secRows('Etiquetas','#BA7517');
    const ins=secRows('Insumos','#555');
    return `<div class="dash-card">
      <div class="dash-plant-h"><span class="dot" style="background:${p.color}"></span><span style="font-size:12px;font-weight:500">${p.nom}</span></div>
      ${bots?`<div class="cat-sub">Botellas</div>${bots}`:''}
      ${etiqs?`<div class="cat-sub">Etiquetas</div>${etiqs}`:''}
      ${ins?`<div class="cat-sub">Insumos</div>${ins}`:''}
      ${!bots&&!etiqs&&!ins?'<div style="font-size:11px;color:#ccc;padding:4px 0">Sin stock</div>':''}
      ${gs.entro>0?`<div style="margin-top:10px;padding-top:8px;border-top:0.5px solid #EEE8DF">
        <div class="dash-row"><span class="dash-lbl" style="color:#0F6E56">Granel ingresado</span><span class="dash-val" style="color:#0F6E56">${fmt(gs.entro)} L</span></div>
        <div class="dash-row"><span class="dash-lbl">Consumido</span><span class="dash-val" style="color:#BA7517">−${fmt(gs.usado)} L</span></div>
        <div class="dash-row"><span class="dash-lbl">Disponible</span><span class="dash-val ${gs.disp<=0?'neg':'pos'}">${fmt(gs.disp)} L</span></div>
      </div>`:''}
    </div>`;
  }).join('');

  const recSal=DB.salidas.slice(0,6);
  const sRows=recSal.length===0?'<tr><td colspan="6" class="empty">Sin salidas registradas</td></tr>'
    :recSal.map(s=>{const pl=PLANT_IDX[s.plant];const pts=s.productos.map(p=>`${PROD_IDX[p.prodId]?.nom} ×${p.tarimas}`).join(' / ');const fns=[...new Set(s.consumos.map(c=>{const f=DB.facturas.find(x=>String(x.id)===String(c.fid));return f?.num||'?'}))];const lns=s.consumosGranel?[...new Set(s.consumosGranel.map(c=>c.lote))]:[];return `<tr><td>${s.fecha}</td><td><span class="dot" style="background:${pl?.color};display:inline-block;margin-right:4px"></span>${pl?.nom}</td><td style="font-weight:500">${s.camion}</td><td style="font-size:11px">${pts}</td><td style="font-size:10px;color:#aaa">${fns.join(', ')}</td><td style="font-size:10px;color:#0F6E56">${lns.join(', ')||'—'}</td></tr>`;}).join('');

  return `${metrics}<div class="dash-grid">${pCards}</div>
    <div class="card"><div class="card-h"><span class="card-title">Últimas salidas de camión</span></div>
    <div class="ox"><table><thead><tr><th class="tl">Fecha</th><th class="tl">Planta</th><th class="tl">Camión</th><th class="tl">Productos</th><th class="tl">Facturas</th><th class="tl" style="color:#0F6E56">Lotes granel</th></tr></thead><tbody>${sRows}</tbody></table></div></div>`;
}

// ── INVENTARIO ─────────────────────────────────────────
function rInv(){
  return UI.invView==='producto' ? rInvProducto() : rInvMaterial();
}

function invToggle(){
  return `<div class="view-toggle">
    <button class="view-btn ${UI.invView==='material'?'act':''}" onclick="UI.invView='material';render()">Por material</button>
    <button class="view-btn ${UI.invView==='producto'?'act':''}" onclick="UI.invView='producto';render()">Por producto</button>
  </div>`;
}

function rInvMaterial(){
  const p=PLANT_IDX[UI.plant];
  const simOn=UI.sim.prods.length>0;
  const simNeed=simOn?calcNeeded(UI.sim.prods):{};
  const simLit=simOn?litrosNecesarios(UI.sim.prods):{Blanco:0,Reposado:0};
  let rows='',anyMat=false;
  ['Botellas','Etiquetas','Insumos'].forEach(cat=>{
    let cr='',catHas=false;
    MATS.filter(m=>m.cat===cat).forEach(m=>{
      const facts=DB.facturas.filter(f=>f.plant===UI.plant&&f.mat===m.id);
      const trans=transitoMat(UI.plant,m.id);
      if(!facts.length&&trans<=0)return;
      catHas=anyMat=true;
      const ini=facts.reduce((s,f)=>s+f.cantIni,0),rest=facts.reduce((s,f)=>s+f.cantRest,0),used=ini-rest;
      const pct=ini>0?Math.round(used/ini*100):0;
      const nomLine=m.hasNom?()=>{
        const deg=stockMatNom(UI.plant,m.id,'DEG'),emb=stockMatNom(UI.plant,m.id,'EMB'),pb=stockMatNom(UI.plant,m.id,'PB');
        const parts=[];
        if(deg>0) parts.push(`<span class="nom-deg">NOM DEG</span> ${fmt(deg)}`);
        if(emb>0) parts.push(`<span class="nom-emb">NOM EMB</span> ${fmt(emb)}`);
        if(pb>0)  parts.push(`<span class="nom-pb">NOM PB</span> ${fmt(pb)}`);
        return parts.length?`<div style="font-size:10px;color:#aaa;margin-top:2px">${parts.join(' · ')}</div>`:'';
      }:()=>'';
      // Celdas de simulación
      let simCells='';
      if(simOn){
        const uso=simNeed[m.id]||0;
        const queda=rest-uso;
        simCells=`<td class="mono" style="background:#FFF8F0">${uso>0?`<span style="color:#BA7517;font-weight:500">−${fmt(uso)}</span>`:'<span style="color:#ddd">—</span>'}</td>
        <td class="mono" style="background:#FFF8F0;font-weight:600;color:${queda<0?'#B02E1E':queda===rest?'#bbb':'#27783A'}">${uso>0?fmt(queda):'<span style="color:#ddd">—</span>'}${queda<0?' ⚠':''}</td>`;
      }
      cr+=`<tr>
        <td><div class="mat-name"><span class="rdv-code">${m.rdv}</span>${m.nom}</div>${nomLine()}</td>
        <td class="mono">${fmt(ini)}</td>
        <td class="mono">${trans>0?`<div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end">
          <span class="transito-badge">→ ${fmt(trans)}</span>
          <label style="font-size:10px;color:#0F6E56;display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap"><input type="checkbox" onchange="marcarLlegada('${UI.plant}','${m.id}')" style="width:auto;margin:0;cursor:pointer"> ya llegó</label>
        </div>`:'<span style="color:#ddd">—</span>'}</td>
        <td class="mono hl ${rest<=0?'neg':rest<ini*.15?'neg':rest<ini*.3?'st-warn':'pos'}">${fmt(rest)}</td>
        ${simCells}
        <td class="mono neg">−${fmt(used)}</td>
        <td><div class="pb"><div class="pb-fill" style="width:${pct}%;background:${pct>=80?'#B02E1E':'#27783A'}"></div></div>
          <span style="font-size:10px;color:#bbb;margin-left:5px">${pct}%</span></td>
        <td><button class="btn btn-gh btn-sm" onclick="detalleFact('${m.id}')">Facturas</button></td></tr>`;
    });
    const nCols=simOn?9:7;
    if(catHas)rows+=`<tr class="cat-row"><td colspan="${nCols}">${cat}</td></tr>${cr}`;
  });
  const nCols=simOn?9:7;
  if(!anyMat)rows=`<tr><td colspan="${nCols}" class="empty">Sin ingresos en ${p?.nom}</td></tr>`;

  const gs=granelStats(UI.plant);
  const lotes=DB.granel.filter(g=>g.planta===UI.plant);
  const gRows=lotes.length===0?'<tr><td colspan="7" class="empty">Sin granel en esta planta</td></tr>'
    :lotes.map(g=>{const pct=g.litros>0?Math.round((g.litros-g.litrosRest)/g.litros*100):0;return `<tr>
      <td style="font-weight:500;color:#0F6E56;font-family:'SF Mono',monospace">${g.lote}</td>
      <td>${g.fecha}</td><td><span class="badge ${g.tipo==='Blanco'?'b-blue':'b-warn'}">${g.tipo}</span></td>
      <td class="mono">${fmt(g.litros)} L</td><td class="mono neg">−${fmt(g.litros-g.litrosRest)} L</td>
      <td class="mono hteal">${fmt(g.litrosRest)} L</td>
      <td><div class="pb"><div class="pb-fill" style="width:${pct}%;background:${pct>=90?'#B02E1E':'#0F6E56'}"></div></div>
        <span style="font-size:10px;color:#bbb;margin-left:5px">${pct}%</span></td>
    </tr>`;}).join('');

  // Simulador de movimientos
  const prOpts=PRODUCTOS.map(pr=>`<option value="${pr.id}">${pr.nom}</option>`).join('');
  const simItems=UI.sim.prods.map((sp,i)=>{const pr=PROD_IDX[sp.prodId];const lit=(LITROS_TARIMA[sp.prodId]||0)*sp.tarimas;return `<span class="sim-chip"><strong>${pr?.nom}</strong> · ${sp.tarimas} tar. · <span style="color:#0F6E56">${fmt(lit)} L</span> <span onclick="quitarSimProd(${i})" style="cursor:pointer;color:#B02E1E;margin-left:4px;font-weight:700">✕</span></span>`;}).join('');
  const simGranel=simOn?`<div style="font-size:11px;color:#0F6E56;margin-top:8px">Granel simulado: Blanco ${fmt(simLit.Blanco||0)} L · Reposado ${fmt(simLit.Reposado||0)} L</div>`:'';
  const simPanel=`<div class="card" style="border-color:#F0D090">
    <div class="card-h" style="background:#FFF8F0"><span class="card-title" style="color:#BA7517">🧮 Simulador de movimientos · ${p?.nom}</span>
      ${simOn?`<button class="btn btn-gh btn-sm" onclick="limpiarSim()">Limpiar simulación</button>`:''}
    </div>
    <div class="card-body">
      <div style="font-size:11px;color:#888;margin-bottom:10px">Agrega tarimas de un producto para ver cuánto material se usaría y con cuánto quedarías — sin afectar el inventario real.</div>
      <div class="prod-add-row">
        <div class="fg"><label>Producto</label><select id="simProd">${prOpts}</select></div>
        <div class="fg"><label>Tarimas</label><input type="number" id="simTar" min="1" value="1" style="width:90px"></div>
        <div class="fg"><label>&nbsp;</label><button class="btn btn-pr" onclick="addSimProd()">+ Simular</button></div>
      </div>
      ${simOn?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${simItems}</div>${simGranel}`:''}
    </div>
  </div>`;

  const simHead=simOn?`<th class="tl" style="color:#BA7517;background:#FFF8F0">Simula uso</th><th class="tl" style="color:#BA7517;background:#FFF8F0">Quedaría</th>`:'';

  return `
    ${simPanel}
    <div class="card"><div class="card-h">
      <span class="card-title">Material envasado · ${p?.nom}</span>
      <div style="display:flex;align-items:center;gap:10px">${invToggle()}<button class="btn btn-gh btn-sm" onclick="expInv()">CSV</button></div>
    </div>
    <div class="ox"><table><thead><tr><th class="tl">Material</th><th>Inicial</th><th class="hteal">En tránsito</th><th class="hl">Disponible</th>${simHead}<th>Consumido</th><th class="tl">Uso</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="card-h">
      <span class="card-title" style="color:#0F6E56">Tequila a granel · ${p?.nom}</span>
      <div style="display:flex;gap:16px;font-size:11px">
        <span><span style="color:#0F6E56;font-weight:500">${fmt(gs.entro)} L</span> ingresados</span>
        <span><span style="color:#BA7517;font-weight:500">${fmt(gs.usado)} L</span> consumidos</span>
        <span><span style="color:${gs.disp<=0?'#B02E1E':'#27783A'};font-weight:500">${fmt(gs.disp)} L</span> disponibles</span>
      </div>
    </div>

function rInvProducto(){
  const p=PLANT_IDX[UI.plant];
  // Collect all mat IDs used by products
  const matsEnProducto=new Set(PRODUCTOS.flatMap(pr=>Object.keys(pr.mats)));

  const prodGroups=PRODUCTOS.map(prod=>{
    // For each material of this product, calculate tarimas possible
    const matRows=Object.entries(prod.mats).map(([mid,uPorTar])=>{
      const m=MAT_IDX[mid]; if(!m) return null;
      const stock=stockMat(UI.plant,mid);
      const tarPosibles=uPorTar>0?Math.floor(stock/uPorTar):0;
      // NOM info for etiquetas
      const nomInfo=m.hasNom?()=>{
        const deg=stockMatNom(UI.plant,mid,'DEG'),emb=stockMatNom(UI.plant,mid,'EMB'),pb=stockMatNom(UI.plant,mid,'PB');
        const parts=[];
        if(deg>0) parts.push(`<span class="nom-deg">NOM DEG</span> ${fmt(deg)}`);
        if(emb>0) parts.push(`<span class="nom-emb">NOM EMB</span> ${fmt(emb)}`);
        if(pb>0)  parts.push(`<span class="nom-pb">NOM PB</span> ${fmt(pb)}`);
        return parts.length?` <span style="font-size:10px;color:#aaa">${parts.join(' · ')}</span>`:'';
      }:()=>'';
      return {mid,m,stock,uPorTar,tarPosibles,nomInfo};
    }).filter(Boolean);

    // Max tarimas = min of all materials
    const maxTar=matRows.length?Math.min(...matRows.map(r=>r.tarPosibles)):0;
    const limitante=matRows.reduce((a,b)=>a.tarPosibles<=b.tarPosibles?a:b,matRows[0]||{});

    // Only show if plant has any of this product's materials OR any stock
    const hasAnyStock=matRows.some(r=>r.stock>0);

    const rows=matRows.map(r=>{
      const isLim=r.mid===limitante?.mid&&matRows.length>1;
      const tarColor=r.tarPosibles===0?'#B02E1E':r.tarPosibles===maxTar&&maxTar>0?'#27783A':'#BA7517';
      return `<div class="prod-mat-row ${isLim?'is-limit':''}">
        <div class="mat-name"><span class="rdv-code">${r.m.rdv}</span></div>
        <div>${r.m.nom}${r.nomInfo()}</div>
        <div style="text-align:right;font-family:'SF Mono',Consolas,monospace;font-size:12px;color:${r.stock===0?'#ccc':'#1A1A18'}">${fmt(r.stock)}</div>
        <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
          <span class="tar-cell" style="color:${tarColor}">${r.tarPosibles} tar.</span>
          ${isLim?'<span class="limitante">limitante</span>':''}
        </div>
      </div>`;
    }).join('');

    const tarColor=maxTar===0?'#B02E1E':maxTar<10?'#BA7517':'#27783A';
    return {prod,maxTar,limitante,rows,hasAnyStock};
  });

  // Materials not in any product
  const otrosMats=MATS.filter(m=>{
    if(matsEnProducto.has(m.id)) return false;
    return stockMat(UI.plant,m.id)>0;
  });

  const groups=prodGroups.map(({prod,maxTar,limitante,rows})=>`
    <div class="prod-group">
      <div class="prod-group-h">
        <span class="prod-group-name">
          <span class="dot" style="background:${prod.tipo==='Blanco'?'#1A3F8A':'#7A3D00'}"></span>
          ${prod.nom}
        </span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="tarimas-badge" style="color:${maxTar===0?'#B02E1E':maxTar<10?'#BA7517':'#27783A'}">
            ${maxTar===0?'Sin stock':'Máx. '+fmt(maxTar)+' tarimas'}
          </span>
          ${maxTar>0&&limitante?`<span style="font-size:10px;color:#888">· limitado por <strong>${limitante.m?.nom||''}</strong></span>`:''}
        </div>
      </div>
      <div style="background:#fff">${rows}</div>
    </div>`).join('');

  const otrosRows=otrosMats.map(m=>{
    const stock=stockMat(UI.plant,m.id);
    const nomInfo=m.hasNom?()=>{const deg=stockMatNom(UI.plant,m.id,'DEG'),emb=stockMatNom(UI.plant,m.id,'EMB'),pb=stockMatNom(UI.plant,m.id,'PB');const parts=[];if(deg>0)parts.push(`<span class="nom-deg">NOM DEG</span> ${fmt(deg)}`);if(emb>0)parts.push(`<span class="nom-emb">NOM EMB</span> ${fmt(emb)}`);if(pb>0)parts.push(`<span class="nom-pb">NOM PB</span> ${fmt(pb)}`);return parts.length?` <span style="font-size:10px;color:#aaa">${parts.join(' · ')}</span>`:''}:()=>'';
    return `<div class="prod-mat-row">
      <div class="mat-name"><span class="rdv-code">${m.rdv}</span></div>
      <div>${m.nom}${nomInfo()}</div>
      <div style="text-align:right;font-family:'SF Mono',Consolas,monospace;font-size:12px">${fmt(stock)}</div>
      <div></div>
    </div>`;
  }).join('');

  const gs=granelStats(UI.plant);

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#999">Inventario por Producto · ${p?.nom}</span>
      ${invToggle()}
    </div>
    ${groups}
    ${otrosRows?`<div class="otros-group"><div class="otros-h">Otros materiales (sin clasificar en producto)</div>${otrosRows}</div>`:''}
    ${gs.entro>0?`<div class="card"><div class="card-h">
      <span class="card-title" style="color:#0F6E56">Tequila a granel · ${p?.nom}</span>
      <div style="display:flex;gap:16px;font-size:11px">
        <span><span style="color:#0F6E56;font-weight:500">${fmt(gs.entro)} L</span> ingresados</span>
        <span><span style="color:#BA7517;font-weight:500">${fmt(gs.usado)} L</span> consumidos</span>
        <span><span style="color:${gs.disp<=0?'#B02E1E':'#27783A'};font-weight:500">${fmt(gs.disp)} L</span> disponibles</span>
      </div>
    </div><div style="padding:10px 14px;font-size:12px;color:#555">${DB.granel.filter(g=>g.planta===UI.plant).map(g=>`<span style="margin-right:14px">Lote <strong style="color:#0F6E56">${g.lote}</strong> · ${g.tipo} · Disp: <strong>${fmt(g.litrosRest)} L</strong></span>`).join('')}</div></div>`:''}
  `;
}

function rSalStep1(){

  const prOpts=PRODUCTOS.map(p=>`<option value="${p.id}">${p.nom}</option>`).join('');

    :UI.wiz.prods.map((p,i)=>{const pr=PROD_IDX[p.prodId];const lit=(LITROS_TARIMA[p.prodId]||0)*p.tarimas;return `<div class="prod-item"><div><div style="font-size:12px;font-weight:500">${pr?.nom}</div><div style="font-size:11px;color:#aaa;margin-top:2px">${p.tarimas} tar. · <span style="color:#0F6E56">${fmt(lit)} L granel</span></div></div><div style="display:flex;align-items:center;gap:10px"><span class="badge b-warn">${p.tarimas} tar.</span><button class="btn btn-dn btn-sm" onclick="quitarProd(${i})">✕</button></div></div>`;}).join('');
  const recSal=DB.salidas.slice(0,8);
  const sRows=recSal.length===0?'<tr><td colspan="5" class="empty">Sin salidas registradas</td></tr>'
    :recSal.map(s=>{const pl=PLANT_IDX[s.plant];const pts=s.productos.map(p=>`${PROD_IDX[p.prodId]?.nom} ×${p.tarimas}`).join(' / ');const lns=s.consumosGranel?[...new Set(s.consumosGranel.map(c=>c.lote))]:[];return `<tr><td>${s.fecha}</td><td><span class="dot" style="background:${pl?.color};display:inline-block;margin-right:4px"></span>${pl?.nom}</td><td style="font-weight:500">${s.camion}</td><td style="font-size:11px">${pts}</td><td style="font-size:10px;color:#0F6E56">${lns.join(', ')||'—'}</td></tr>`;}).join('');
  return `

    <div class="card"><div class="card-h"><span class="card-title">Datos del camión</span></div><div class="card-body">
      <div class="row3" style="margin-bottom:14px">
        <div class="fg"><label>Planta de salida</label><select onchange="UI.wiz.plant=this.value;UI.wiz.prods=[];render()">${plOpts}</select></div>

        <div class="fg"><label>Fecha de salida</label><input type="date" value="${UI.wiz.fecha}" onchange="UI.wiz.fecha=this.value"></div>
      </div>
      <hr class="sep">
      <div class="sec-title">Productos en este camión</div>

        <div class="fg"><label>Tarimas</label><input type="number" id="at" min="1" value="1" style="width:90px"></div>
        <div class="fg"><label>&nbsp;</label><button class="btn btn-gh" onclick="addProd()">+ Agregar</button></div>
      </div>
      <div style="margin-bottom:14px">${prodItems}</div>
      ${UI.wiz.prods.length>0?`<button class="btn btn-pr" onclick="irStep2()">Continuar → Asignar materiales y granel</button>`:''}

function rSalStep2(){
  const needed=calcNeeded(UI.wiz.prods);
  const litNeed=litrosNecesarios(UI.wiz.prods);
  const pl=PLANT_IDX[UI.wiz.plant];
  const chips=UI.wiz.prods.map(p=>`<span class="chip"><strong>${PROD_IDX[p.prodId]?.nom}</strong> · ${p.tarimas} tar. · <span style="color:#0F6E56">${fmt((LITROS_TARIMA[p.prodId]||0)*p.tarimas)} L</span></span>`).join('');
  const matBlocks=Object.entries(needed).map(([mid,qty])=>{
    const m=MAT_IDX[mid];if(!UI.wizAlloc[mid])UI.wizAlloc[mid]={};
    const tot=Object.values(UI.wizAlloc[mid]).reduce((s,v)=>s+(v||0),0);const diff=qty-tot;
    const stHtml=diff===0?`<span class="alloc-st st-ok">✓ Completo</span>`:diff>0?`<span class="alloc-st st-err">Faltan ${fmt(diff)}</span>`:`<span class="alloc-st st-warn">Exceso ${fmt(-diff)}</span>`;
    const avail=factsAvail(UI.wiz.plant,mid);
    const fRows=avail.length===0?`<div style="padding:10px 14px;font-size:11px;color:#B02E1E">⚠ Sin stock de ${m?.rdv} ${m?.nom} en ${pl?.nom}</div>`
      :avail.map(f=>{const cur=UI.wizAlloc[mid]?.[f.id]||0;return `<div class="alloc-row"><div><div class="alloc-fnum">${f.num}${nomBadgeInline(f.nom)}</div><div class="alloc-fdisp">${f.prov||'—'} · ${f.fecha} · Disp: <strong>${fmt(f.cantRest)}</strong></div></div><input type="number" min="0" max="${f.cantRest}" value="${cur||''}" placeholder="0" oninput="setAlloc('${mid}','${f.id}',+this.value);updSt('${mid}',${qty})"></div>`;}).join('');
    return `<div class="alloc-block"><div class="alloc-hdr mat"><span class="alloc-name"><span class="rdv-code">${m?.rdv||''}</span>${m?.nom||mid}</span><div style="display:flex;align-items:center;gap:12px"><span class="alloc-need" style="color:#BA7517">Necesario: ${fmt(qty)}</span><span id="ast-${mid}">${stHtml}</span></div></div>${fRows}</div>`;
  }).join('');
  const granelBlocks=Object.entries(litNeed).filter(([,l])=>l>0).map(([tipo,lit])=>{
    if(!UI.wizGranel[tipo])UI.wizGranel[tipo]={};
    const tot=Object.values(UI.wizGranel[tipo]).reduce((s,v)=>s+(v||0),0);const diff=lit-tot;

function editarFact(id){UI.editFact=String(id);UI._ef={};render();}

async function guardarFact(id){
  const f=DB.facturas.find(x=>String(x.id)===String(id));
  if(!f)return;
  const updates={
    num:UI._ef.num??f.num,
    fecha:UI._ef.fecha??f.fecha,
    prov:UI._ef.prov??f.prov??'',
    cantIni:UI._ef.cantIni??f.cantIni,
    nom:UI._ef.nom??f.nom??null,
  };
  // Si cambió el inicial, ajustamos el disponible proporcionalmente
  if(updates.cantIni!==f.cantIni){
    const consumido=f.cantIni-f.cantRest;
    updates.cantRest=Math.max(0,updates.cantIni-consumido);
  } else { updates.cantRest=f.cantRest; }
  try{
    const res=await api('/api/factura/'+id,{method:'PUT',body:JSON.stringify(updates)});
    if(!res.ok)throw new Error();
    Object.assign(f,updates);
    UI.editFact=null;UI._ef={};
    toast('✓ Factura actualizada');render();
  }catch(e){toast('Error al guardar',true);}
}

async function eliminarFact(id){
  const f=DB.facturas.find(x=>String(x.id)===String(id));
  if(!f)return;
  const m=MAT_IDX[f.mat];
  if(!confirm(`¿Eliminar la factura ${f.num}?\n${m?.nom} · ${fmt(f.cantIni)} uds\n\nEsta acción no se puede deshacer.`))return;
  try{
    const res=await api('/api/factura/'+id,{method:'DELETE'});
    if(!res.ok)throw new Error();
    DB.facturas=DB.facturas.filter(x=>String(x.id)!==String(id));
    toast(`✓ Factura ${f.num} eliminada`);render();
  }catch(e){toast('Error al eliminar',true);}
}

async function regTraslado(){
  const qty=parseInt(UI.tsl.qty);
  if(!qty||qty<=0){toast('Ingresa una cantidad válida',true);return;}
  if(UI.tsl.origen===UI.tsl.destino){toast('Origen y destino no pueden ser iguales',true);return;}
  const stock=stockMat(UI.tsl.origen,UI.tsl.mat);
  if(qty>stock){toast(`Solo hay ${fmt(stock)} disponibles en ${PLANT_IDX[UI.tsl.origen]?.nom}`,true);return;}
  const traslado={
    id:Date.now(),origen:UI.tsl.origen,destino:UI.tsl.destino,
    mat:UI.tsl.mat,cant:qty,fecha:UI.tsl.fecha,
    nota:UI.tsl.nota.trim(),
    usuario:sessionStorage.getItem('rdv_user')||'admin'
  };
  try{
    const res=await api('/api/traslado',{method:'POST',body:JSON.stringify(traslado)});
    if(!res.ok)throw new Error();
    // Actualizar localmente: descontar del origen
    let restante=qty;
    DB.facturas.filter(f=>f.plant===UI.tsl.origen&&f.mat===UI.tsl.mat&&f.cantRest>0)
      .sort((a,b)=>a.cantRest-b.cantRest)
      .forEach(f=>{if(restante<=0)return;const usar=Math.min(f.cantRest,restante);f.cantRest-=usar;restante-=usar;});
    // Sumar al destino
    const mnom=MAT_IDX[UI.tsl.mat]?.nom||UI.tsl.mat;
    DB.facturas.push({id:traslado.id,num:`TRASLADO-${UI.tsl.origen.toUpperCase().slice(0,3)}`,
      prov:`Traslado desde ${PLANT_IDX[UI.tsl.origen]?.nom}`,
      plant:UI.tsl.destino,mat:UI.tsl.mat,cantIni:qty,cantRest:qty,fecha:UI.tsl.fecha});
    DB.traslados.unshift(traslado);
    const pO=PLANT_IDX[UI.tsl.origen]?.nom,pD=PLANT_IDX[UI.tsl.destino]?.nom;
    toast(`✓ ${fmt(qty)} ${mnom} · ${pO} → ${pD}`);
    UI.tsl.qty='';UI.tsl.nota='';render();
  }catch(e){toast('Error al registrar traslado',true);}
}

  if(!isAdmin()){toast('Solo lectura: no puedes registrar salidas',true);return;}
  const needed=calcNeeded(UI.wiz.prods),litNeed=litrosNecesarios(UI.wiz.prods);
  const consumos=[];let ok=true;
  Object.entries(needed).forEach(([mid,qty])=>{const alloc=UI.wizAlloc[mid]||{};const tot=Object.values(alloc).reduce((s,v)=>s+(v||0),0);if(tot!==qty)ok=false;Object.entries(alloc).forEach(([fid,cant])=>{if(cant>0)consumos.push({mat:mid,fid:fid,cant});});});
  const consumosGranel=[];
  Object.entries(litNeed).filter(([,l])=>l>0).forEach(([tipo,lit])=>{const alloc=UI.wizGranel[tipo]||{};const tot=Object.values(alloc).reduce((s,v)=>s+(v||0),0);if(tot!==lit)ok=false;Object.entries(alloc).forEach(([gid,litros])=>{if(litros>0){const g=DB.granel.find(x=>String(x.id)===String(gid));consumosGranel.push({gId:gid,lote:g?.lote||'?',tipo,litros});}});});
  if(!ok&&!confirm('Hay materiales o litros sin asignar completamente.\n¿Confirmar de todas formas?'))return;
  const salida={id:Date.now(),camion:UI.wiz.camion,plant:UI.wiz.plant,fecha:UI.wiz.fecha,productos:[...UI.wiz.prods],consumos,consumosGranel};
  try{
    const res=await api('/api/salida',{method:'POST',body:JSON.stringify(salida)});
    if(!res.ok)throw new Error();
    consumos.forEach(c=>{const f=DB.facturas.find(x=>String(x.id)===String(c.fid));if(f)f.cantRest=Math.max(0,f.cantRest-c.cant);});
    consumosGranel.forEach(c=>{const g=DB.granel.find(x=>String(x.id)===String(c.gId));if(g)g.litrosRest=Math.max(0,g.litrosRest-c.litros);});
    DB.salidas.unshift(salida);
    toast(`✓ Camión ${UI.wiz.camion} confirmado`);
    UI.wiz={step:1,camion:'',plant:UI.wiz.plant,fecha:hoy(),prods:[]};UI.wizAlloc={};UI.wizGranel={};render();
  }catch(e){toast('Error al guardar la salida',true);}
}
function detalleFact(matId){const m=MAT_IDX[matId];const facts=DB.facturas.filter(f=>f.plant===UI.plant&&f.mat===matId);if(!facts.length){alert(`Sin facturas de ${m?.rdv} ${m?.nom}`);return;}let msg=`${m?.rdv} · ${m?.nom} · ${PLANT_IDX[UI.plant]?.nom}\n${'─'.repeat(44)}\n`;facts.forEach(f=>{const pct=f.cantIni>0?Math.round((1-f.cantRest/f.cantIni)*100):0;msg+=`\nFactura: ${f.num}${f.nom?' [NOM '+f.nom+']':''}\nProveedor: ${f.prov||'N/A'}\nFecha: ${f.fecha}\nInicial: ${fmt(f.cantIni)} | Disponible: ${fmt(f.cantRest)} | ${pct}% consumido\n`;});alert(msg);}
function expInv(){const p=PLANT_IDX[UI.plant];const rows=[['Código','Categoría','Material','Inicial','Consumido','Disponible']];['Botellas','Etiquetas','Insumos'].forEach(cat=>{MATS.filter(m=>m.cat===cat).forEach(m=>{const facts=DB.facturas.filter(f=>f.plant===UI.plant&&f.mat===m.id);if(!facts.length)return;const ini=facts.reduce((s,f)=>s+f.cantIni,0),rest=facts.reduce((s,f)=>s+f.cantRest,0);rows.push([m.rdv,cat,m.nom,ini,ini-rest,rest]);});});const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`RDV_${p?.nom}_${hoy()}.csv`;a.click();}

// ── INIT ──
async function boot(){
  if(getToken()){
    try{
      await loadDB();
      document.getElementById('login-screen').style.display='none';
      render();
    }catch(e){ showLogin(); }
  } else {
    showLogin();
  }
  document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('login-user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-pass').focus();});
}
boot();
</script>
